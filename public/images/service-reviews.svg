<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reviews Hub - AI replies to Google reviews">
  <defs>
    <linearGradient id="rvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="rvacc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="rvsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#7c2d12" flood-opacity="0.10"/>
    </filter>
    <path id="rvstar" d="M0 -8 L2.35 -3.24 L7.61 -2.47 L3.8 1.24 L4.7 6.47 L0 4 L-4.7 6.47 L-3.8 1.24 L-7.61 -2.47 L-2.35 -3.24 Z"/>
  </defs>
  <rect width="480" height="200" rx="20" fill="url(#rvbg)"/>

  <!-- Incoming Google review -->
  <g filter="url(#rvsh)">
    <rect x="40" y="18" width="400" height="78" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="72" cy="44" r="14" fill="#e2e8f0"/>
  <rect x="98" y="36" width="104" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="98" y="52" width="62" height="7" rx="3.5" fill="#e2e8f0"/>
  <g fill="#f59e0b">
    <use href="#rvstar" x="316" y="44"/>
    <use href="#rvstar" x="338" y="44"/>
    <use href="#rvstar" x="360" y="44"/>
    <use href="#rvstar" x="382" y="44"/>
    <use href="#rvstar" x="404" y="44"/>
  </g>
  <rect x="72" y="74" width="288" height="8" rx="4" fill="#eef2f7"/>

  <!-- Connector -->
  <path d="M96 96 L96 112" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>

  <!-- AI-drafted reply, pending owner approval -->
  <g filter="url(#rvsh)">
    <rect x="80" y="112" width="360" height="72" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <circle cx="112" cy="140" r="14" fill="url(#rvacc)"/>
  <text x="112" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>
  <rect x="140" y="134" width="146" height="9" rx="4.5" fill="#fde68a"/>
  <rect x="112" y="164" width="292" height="8" rx="4" fill="#eef2f7"/>

  <!-- Owner approval control -->
  <g filter="url(#rvsh)">
    <rect x="330" y="124" width="92" height="30" rx="15" fill="url(#rvacc)"/>
  </g>
  <path d="M352 139 l5 5 l10 -11" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="372" y="134" width="30" height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>
</svg>
